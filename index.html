<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>life zap operater</title>
    <style>
        body {
            /* インターネット黎明期を彷彿とさせるフォント */
            font-family: "ＭＳ Ｐゴシック", "MS PGothic", "Osaka", sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }

        /* 画面全体の透明な水面屈折コンテナ */
        .container {
            width: 100%;
            max-width: 600px;
            filter: url('#water-refraction-3d'); /* 屈折＋立体光沢フィルター */
            will-change: filter;
            position: relative;
            z-index: 1;
        }

        .page-logo {
            width: 250px;
            max-width: 100%;
            height: auto;
            margin-bottom: 10px; /* 少し縮める */
        }

        /* ロゴ下のテキストスタイル */
        .logo-tagline {
            font-family: "ＭＳ Ｐゴシック", "MS PGothic", "Osaka", sans-serif;
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* 動画プレイヤーの外枠 */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9の比率 */
            background: #000;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .video-wrapper iframe, .video-wrapper #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* 絶対にYouTubeへ飛ばさない透明シールド */
        .shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .info-panel {
            margin-bottom: 20px;
        }

        /* 立体的なガラス風ボタンのUI */
        button {
            background: linear-gradient(to bottom, #fdfdfd 0%, #e0e0e0 100%);
            border: 1px solid #999;
            border-radius: 25px;
            color: #333;
            padding: 10px 24px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 1), 
                0 1px 3px rgba(0, 0, 0, 0.3);
            transition: all 0.1s;
            margin-bottom: 20px;
        }
        button:hover {
            background: linear-gradient(to bottom, #ffffff 0%, #ebebeb 100%);
        }
        button:active {
            background: linear-gradient(to bottom, #d0d0d0 0%, #e8e8e8 100%);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border-color: #888;
            transform: translateY(1px);
        }
        button:disabled {
            background: #e6e6e6;
            color: #aaa;
            text-shadow: none;
            box-shadow: none;
            border-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* 説明文パネルのスタイル（修正：行間を広げて重なりを解消） */
        .description-panel {
            margin-top: 10px;
            text-align: left;
            line-height: 2.2; /* 明確に行間を広げる */
            color: #ddd;
            font-size: 0.95rem;
        }
        
        /* 見出し「concept」のスタイル */
        .concept-heading {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        .description-panel p {
            margin: 0 0 15px 0;
        }

        /* 「暗渠Network」とGIF画像のスタイル */
        .signature-area {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-top: 30px;
            gap: 10px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .signature-text {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
        }
        .signature-gif {
            height: 12em; 
            width: auto;
            max-width: 50vw; 
            object-fit: contain;
        }

        /* 波紋シミュレーション用非表示キャンバス */
        #ripple-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

<canvas id="ripple-canvas"></canvas>

<!-- 画面が欠けたりブレて二重になったりしないよう描画エリアを拡張＆シンプル化したSVGフィルター -->
<svg style="display:none;">
  <defs>
    <filter id="water-refraction-3d" x="-50%" y="-50%" width="200%" height="200%">
      <feImage id="fe-image" result="rippleMap" />
      
      <!-- 波による水面の歪み（屈折） -->
      <feDisplacementMap in="SourceGraphic" in2="rippleMap" scale="30" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      
      <!-- 波の山に当たる淡い白光のハイライト -->
      <feSpecularLighting in="rippleMap" surfaceScale="3" specularConstant="0.8" specularExponent="15" lighting-color="#ffffff" result="light">
        <feDistantLight azimuth="135" elevation="60" />
      </feSpecularLighting>
      
      <!-- 歪んだ像の上に、光のハイライトだけを加算（画像が二重にならず自然に立体化） -->
      <feComposite in="light" in2="displaced" operator="in" result="lightCut" />
      <feComposite in="displaced" in2="lightCut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>
  </defs>
</svg>

<div class="container">
    
    <img src="new_rogowhite.png" alt="サイトロゴ" class="page-logo">
    
    <!-- ロゴ下のテキスト追加 -->
    <div class="logo-tagline">暗渠ネットワークは、安全です。この変なズレ（文字の重なり）をCSSで修正し、ボタンのテキストとロゴ下のメッセージを追加しました。
